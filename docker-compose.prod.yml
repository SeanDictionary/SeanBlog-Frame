# 生产部署：直接拉取 GHCR 发布镜像，无需在部署机构建源码。
#
# 镜像由 .github/workflows/docker-publish.yml 自动构建并推送：
#   ghcr.io/seandictionary/seanblog-frame:latest
#
# 用法：
#   docker compose -f docker-compose.prod.yml up -d
# 升级：
#   docker compose -f docker-compose.prod.yml pull && docker compose -f docker-compose.prod.yml up -d
#
# 站点 URL（siteUrl）在后台「站点信息」设置项运行时配置，镜像与域名解耦。
# 数据持久化见命名卷，重建容器不会丢失（见 README「数据持久化与备份」）。

services:
  secrets:
    image: ghcr.io/seandictionary/seanblog-frame:latest
    user: root
    entrypoint: ["node", "scripts/initialize-secrets.mjs"]
    restart: "no"
    volumes:
      - seanblog_secrets:/run/secrets

  app:
    image: ghcr.io/seandictionary/seanblog-frame:latest
    container_name: seanblog-app
    restart: unless-stopped
    entrypoint: ["/bin/sh", "scripts/start-production.sh"]
    environment:
      SECRETS_DIRECTORY: /run/secrets
      # 容器化部署默认位于反向代理后，信任 X-Forwarded-For 以正确限流与采集访客 IP
      TRUST_PROXY_HEADERS: "true"
    ports:
      - "3000:3000"
    volumes:
      - seanblog_secrets:/run/secrets:ro
      - seanblog_content:/app/content
      - seanblog_themes:/app/themes
    depends_on:
      secrets:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  db:
    image: postgres:16-alpine
    container_name: seanblog-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: seanblog_frame
    volumes:
      - seanblog_pgdata:/var/lib/postgresql/data
      - seanblog_secrets:/run/secrets:ro
    depends_on:
      secrets:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d seanblog_frame"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  seanblog_pgdata:
  seanblog_secrets:
  seanblog_content:
  seanblog_themes:
