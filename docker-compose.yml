x-build: &build
  context: .
  dockerfile: Dockerfile
  args:
    # NEXT_PUBLIC_* 为构建期变量；SITE_URL 可在 .env / 环境变量中覆盖。
    # 未设置时默认 localhost:3000，仅适用于本地验证，正式部署务必设置真实域名。
    NEXT_PUBLIC_SITE_URL: ${SITE_URL:-http://localhost:3000}

services:
  secrets:
    build: *build
    entrypoint: ["node", "scripts/initialize-secrets.mjs"]
    restart: "no"
    volumes:
      - seanblog_secrets:/run/secrets

  app:
    build: *build
    container_name: seanblog-app
    restart: unless-stopped
    entrypoint: ["/bin/sh", "scripts/start-production.sh"]
    environment:
      NEXT_PUBLIC_SITE_URL: ${SITE_URL:-http://localhost:3000}
      SECRETS_DIRECTORY: /run/secrets
      # 容器化部署默认位于反向代理后，信任 X-Forwarded-For 以正确限流与采集访客 IP
      TRUST_PROXY_HEADERS: "true"
    ports:
      - "3000:3000"
    volumes:
      - seanblog_secrets:/run/secrets:ro
      - seanblog_content:/app/content
      - seanblog_themes:/app/themes
    depends_on:
      secrets:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  db:
    image: postgres:16-alpine
    container_name: seanblog-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: seanblog_frame
    volumes:
      - seanblog_pgdata:/var/lib/postgresql/data
      - seanblog_secrets:/run/secrets:ro
    depends_on:
      secrets:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d seanblog_frame"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  seanblog_pgdata:
  seanblog_secrets:
  seanblog_content:
  seanblog_themes:
